name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Calculator.slnx

      - name: Build
        run: dotnet build Calculator.slnx --no-restore

      - name: Test
        run: dotnet test Calculator.slnx --no-build --collect:"XPlat Code Coverage"
