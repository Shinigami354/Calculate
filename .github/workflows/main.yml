name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Calculator.slnx

      - name: Build
        run: dotnet build Calculator.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test Calculator.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"
